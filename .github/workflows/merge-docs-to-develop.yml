```yaml
name: Docs to Develop

on:
  push:
    branches:
      - docs

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-to-develop
  cancel-in-progress: false

jobs:
  docs-to-develop:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. 소스 체크아웃
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. develop / docs 최신 상태 가져오기
      # --------------------------------------------------
      - name: Fetch branches
        run: |
          git fetch origin develop
          git fetch origin docs

      # --------------------------------------------------
      # 3. docs → develop 변경사항 확인
      #    모든 변경 파일이 .md인지 검사
      # --------------------------------------------------
      - name: Check markdown only
        id: check
        shell: bash
        run: |
          echo "=== docs → develop 변경 파일 ==="

          CHANGED_FILES=$(git diff \
            --name-only \
            origin/develop...origin/docs)

          echo "$CHANGED_FILES"

          echo ""

          # 변경사항 없음
          if [ -z "$CHANGED_FILES" ]; then
            echo "변경사항이 없습니다."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # .md가 아닌 파일 검색
          INVALID_FILES=$(echo "$CHANGED_FILES" | grep -v '\.md$' || true)

          if [ -n "$INVALID_FILES" ]; then
            echo "❌ .md 이외의 파일이 포함되어 있습니다."
            echo ""
            echo "$INVALID_FILES"
            exit 1
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          echo ""
          echo "✅ 모든 변경 파일이 .md입니다."

      # --------------------------------------------------
      # 4. 기존 docs → develop PR 확인
      # --------------------------------------------------
      - name: Check existing PR
        if: steps.check.outputs.has_changes == 'true'
        id: existing-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base develop \
            --head docs \
            --state open \
            --json number \
            --jq '.[0].number')

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 5. docs → develop PR 생성
      # --------------------------------------------------
      - name: Create Pull Request
        if: |
          steps.check.outputs.has_changes == 'true' &&
          steps.existing-pr.outputs.PR_NUMBER == ''
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create \
            --base develop \
            --head docs \
            --title "docs → develop 자동 반영" \
            --body "## 자동 생성 PR

          \`docs\` 브랜치의 Markdown 변경사항을
          \`develop\` 브랜치에 자동 반영합니다.

          ### 검사 결과

          - 변경 파일: \`.md\`만 허용
          - 대상 브랜치: \`develop\`
          - 소스 브랜치: \`docs\`

          이 PR은 GitHub Actions에 의해 자동 생성되었습니다.")

          echo "PR_URL=$PR_URL" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 6. PR 번호 결정
      #    새로 생성했으면 새 PR
      #    기존 PR이 있으면 기존 PR
      # --------------------------------------------------
      - name: Get PR number
        if: steps.check.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.existing-pr.outputs.PR_NUMBER }}"

          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list \
              --base develop \
              --head docs \
              --state open \
              --json number \
              --jq '.[0].number')
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "❌ PR을 찾을 수 없습니다."
            exit 1
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          echo "PR #$PR_NUMBER"

      # --------------------------------------------------
      # 7. PR 자동 Merge
      # --------------------------------------------------
      - name: Enable Auto Merge
        if: steps.pr.outputs.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge \
            "${{ steps.pr.outputs.PR_NUMBER }}" \
            --auto \
            --merge
```
