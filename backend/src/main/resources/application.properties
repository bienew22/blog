spring.application.name=backend

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

app.auth.google-client-id=${GOOGLE_CLIENT_ID:}
app.auth.jwt-secret=${JWT_SECRET}
app.auth.admin-emails=${ADMIN_EMAILS:}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.access-token-lifetime=${ACCESS_TOKEN_LIFETIME:15m}
app.auth.refresh-token-lifetime=${REFRESH_TOKEN_LIFETIME:14d}
app.auth.dev-login-enabled=${DEV_AUTH_ENABLED:false}